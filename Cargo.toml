[package]
name = "libresoda"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust port of music-lib's soda (汽水音乐 / Soda Music) implementation: search, playlists, albums, lyrics, VIP-aware stream resolution and CENC/MP4 audio decryption."
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["soda-music", "qishui", "douyin", "music", "decrypt"]
categories = ["multimedia::audio", "api-bindings"]

[lib]
name = "libresoda"
path = "src/lib.rs"

[features]
default = ["cdp-signer"]
## 扫码登录签名页：Rust 通过 CDP 驱动 Chromium，不再依赖 Node。
cdp-signer = ["dep:chromiumoxide", "dep:futures", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
aes = "0.8"
ctr = "0.9"
base64 = "0.22"
chromiumoxide = { version = "0.9", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }

[dev-dependencies]
serde_json = "1"
aes = "0.8"
ctr = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
